<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether Lab · Unified Telemetry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["IBM Plex Sans", "Inter", "system-ui", "sans-serif"],
              mono: ["IBM Plex Mono", "ui-monospace", "monospace"],
            },
            colors: {
              void: "#05070b",
              panel: "#0b1118",
              card: "#101821",
              line: "#1c2a38",
              cyan: { neon: "#22e0d0" },
              violet: { neon: "#a78bfa" },
            },
          },
        },
      };
    </script>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", Inter, system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(34, 224, 208, 0.08), transparent 50%),
          radial-gradient(900px 500px at 100% 0%, rgba(167, 139, 250, 0.08), transparent 45%),
          #05070b;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-presets="react">
      const { useMemo, useState } = React;

      const MOCK = {
        athlete: { name: "Alex Rivera", role: "Endurance + Strength", device: "Garmin Forerunner 965 · Huawei Watch GT", lastSync: "Today · 06:14" },
        wearable: { restingHr: 52, restingHrDelta: -2, hrv: 68, hrvDelta: 4, readiness: 87, readinessLabel: "Prime", sleepHours: 7.4, spo2: 98, stress: 18, bodyBattery: 82 },
        macros: {
          protein: { current: 162, target: 180, unit: "g" },
          fat: { current: 78, target: 95, unit: "g" },
          carbs: { current: 41, target: 60, unit: "g" },
          calories: { current: 1684, target: 2100, unit: "kcal" },
        },
        training: {
          cardio: { title: "Incline Treadmill Cardio", date: "Today · AM", duration: "42:00", incline: "8%", distance: "5.6 km", calories: 487, avgHr: 141, maxHr: 164, pace: "7:30 /km" },
          strength: {
            title: "Full-Body Strength Supersets",
            date: "Yesterday · PM",
            duration: "54:00",
            calories: 312,
            volume: "18,640 kg",
            supersets: [
              { name: "A · Posterior chain", pairs: [{ exercise: "Romanian deadlift", sets: 4, reps: "8", load: "90 kg" }, { exercise: "Weighted chin-up", sets: 4, reps: "6", load: "+12 kg" }] },
              { name: "B · Push + core", pairs: [{ exercise: "Incline DB press", sets: 4, reps: "8", load: "32 kg" }, { exercise: "Hanging knee raise", sets: 4, reps: "12", load: "BW" }] },
              { name: "C · Unilateral", pairs: [{ exercise: "Walking lunge", sets: 3, reps: "10/leg", load: "24 kg" }, { exercise: "Single-arm row", sets: 3, reps: "10", load: "28 kg" }] },
            ],
          },
        },
        supplements: [
          { id: "omega", name: "Omega-3", dose: "2 g EPA+DHA", timing: "With first meal", taken: true },
          { id: "ashwa", name: "Ashwagandha KSM-66", dose: "600 mg", timing: "Evening", taken: true },
          { id: "enzymes", name: "Digestive Enzymes", dose: "1 capsule", timing: "With lunch", taken: false },
        ],
      };

      const NAV = [
        { id: "overview", label: "Overview" },
        { id: "wearable", label: "Wearable" },
        { id: "training", label: "Training" },
        { id: "nutrition", label: "Nutrition" },
      ];

      function IconPulse({ className = "w-5 h-5" }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
            <path d="M3 12h3l2.2-6 3.6 12 2.4-6H21" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        );
      }

      function pct(current, target) {
        return target ? Math.min(100, Math.round((current / target) * 100)) : 0;
      }

      function Ring({ value, size = 128, stroke = 10, color = "#22e0d0" }) {
        const r = (size - stroke) / 2;
        const c = 2 * Math.PI * r;
        const offset = c - (value / 100) * c;
        return (
          <svg width={size} height={size} className="rotate-[-90deg]">
            <circle cx={size / 2} cy={size / 2} r={r} stroke="#1c2a38" strokeWidth={stroke} fill="none" />
            <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" />
          </svg>
        );
      }

      function LoginScreen({ onSignIn }) {
        const [email, setEmail] = useState("alex.rivera@aether.lab");
        const [password, setPassword] = useState("password");
        const [busy, setBusy] = useState(false);
        const submit = (e) => {
          e.preventDefault();
          setBusy(true);
          setTimeout(() => onSignIn(), 350);
        };
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="w-full max-w-md">
              <div className="mb-8 text-center">
                <div className="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl border border-cyan-neon/30 bg-panel">
                  <IconPulse className="w-6 h-6 text-cyan-neon" />
                </div>
                <p className="font-mono text-[11px] tracking-[0.28em] text-cyan-neon uppercase">Aether Lab</p>
                <h1 className="mt-2 text-3xl font-semibold">Unified Telemetry</h1>
                <p className="mt-2 text-sm text-slate-400">Wearable · Training · Nutrition</p>
              </div>
              <form onSubmit={submit} className="rounded-2xl border border-line bg-panel/80 p-6">
                <label className="block text-xs text-slate-400 mb-1.5">Email</label>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="mb-4 w-full rounded-xl border border-line bg-void px-3.5 py-3 text-sm outline-none" required />
                <label className="block text-xs text-slate-400 mb-1.5">Password</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="mb-5 w-full rounded-xl border border-line bg-void px-3.5 py-3 text-sm outline-none" required />
                <button type="submit" className="w-full rounded-xl bg-cyan-neon py-3 text-sm font-semibold text-void">{busy ? "Signing in…" : "Sign In"}</button>
                <p className="mt-4 text-center text-[11px] text-slate-500">Any email and password works</p>
              </form>
            </div>
          </div>
        );
      }

      function MacroBar({ label, current, target, unit, tone }) {
        const tones = { protein: "from-cyan-neon to-emerald-400", fat: "from-violet-neon to-fuchsia-400", carbs: "from-amber-400 to-orange-400", calories: "from-sky-400 to-cyan-neon" };
        return (
          <div>
            <div className="mb-1.5 flex justify-between text-xs">
              <span className="uppercase tracking-wider text-slate-400">{label}</span>
              <span className="font-mono">{current} / {target} {unit}</span>
            </div>
            <div className="h-2 rounded-full bg-void border border-line overflow-hidden">
              <div className={`h-full bg-gradient-to-r ${tones[tone]}`} style={{ width: pct(current, target) + "%" }} />
            </div>
          </div>
        );
      }

      function Dashboard({ onSignOut }) {
        const [section, setSection] = useState("overview");
        const [mobileNav, setMobileNav] = useState(false);
        const [supps, setSupps] = useState(MOCK.supplements);
        const takenCount = useMemo(() => supps.filter((s) => s.taken).length, [supps]);
        const show = (id) => section === "overview" || section === id;
        return (
          <div className="min-h-screen flex">
            <aside className="hidden lg:flex w-64 flex-col border-r border-line bg-panel/80">
              <div className="px-5 py-6 border-b border-line">
                <p className="font-mono text-[10px] tracking-[0.22em] text-cyan-neon uppercase">Aether Lab</p>
                <p className="text-sm font-semibold">Telemetry</p>
              </div>
              <nav className="flex-1 px-3 py-4 space-y-1">
                {NAV.map((item) => (
                  <button key={item.id} onClick={() => setSection(item.id)} className={`w-full rounded-xl px-3 py-2.5 text-left text-sm ${section === item.id ? "bg-cyan-neon/10 text-cyan-neon border border-cyan-neon/20" : "text-slate-400 border border-transparent"}`}>{item.label}</button>
                ))}
              </nav>
              <div className="p-4 border-t border-line">
                <p className="text-sm font-medium">{MOCK.athlete.name}</p>
                <button onClick={onSignOut} className="mt-3 w-full rounded-xl border border-line px-3 py-2 text-xs text-slate-400">Sign out</button>
              </div>
            </aside>
            <div className="flex-1 min-w-0">
              <header className="sticky top-0 z-20 border-b border-line bg-void/80 backdrop-blur">
                <div className="flex items-center justify-between px-4 py-3.5">
                  <div>
                    <button className="lg:hidden mb-2 rounded-lg border border-line px-2 py-1 text-xs" onClick={() => setMobileNav(!mobileNav)}>Menu</button>
                    <h2 className="text-lg font-semibold">Command Dashboard</h2>
                    <p className="text-[11px] text-slate-500 font-mono">Last sync {MOCK.athlete.lastSync}</p>
                  </div>
                  <span className="hidden sm:flex items-center gap-2 text-xs text-slate-400"><span className="h-2 w-2 rounded-full bg-cyan-neon animate-pulse" /> Live mock</span>
                </div>
                {mobileNav && (
                  <div className="lg:hidden px-3 pb-3 flex gap-2 overflow-x-auto">
                    {NAV.map((item) => (
                      <button key={item.id} onClick={() => { setSection(item.id); setMobileNav(false); }} className={`rounded-full px-3 py-1.5 text-xs ${section === item.id ? "bg-cyan-neon text-void" : "border border-line text-slate-400"}`}>{item.label}</button>
                    ))}
                  </div>
                )}
              </header>
              <main className="p-4 sm:p-6 space-y-6 max-w-7xl">
                {show("wearable") && (
                  <section>
                    <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-cyan-neon">Wearable telemetry</p>
                    <h3 className="text-xl font-semibold mb-3">Readiness stack</h3>
                    <div className="grid gap-4 md:grid-cols-3">
                      <article className="rounded-2xl border border-line bg-card p-5">
                        <p className="text-xs text-slate-400 uppercase">Resting heart rate</p>
                        <p className="mt-3 text-4xl font-semibold">{MOCK.wearable.restingHr} <span className="text-sm text-slate-500">bpm</span></p>
                        <p className="mt-2 text-xs text-emerald-400">{MOCK.wearable.restingHrDelta} bpm vs 7-day</p>
                      </article>
                      <article className="rounded-2xl border border-line bg-card p-5">
                        <p className="text-xs text-slate-400 uppercase">HRV (rMSSD)</p>
                        <p className="mt-3 text-4xl font-semibold">{MOCK.wearable.hrv} <span className="text-sm text-slate-500">ms</span></p>
                        <p className="mt-2 text-xs text-emerald-400">+{MOCK.wearable.hrvDelta} ms recovery</p>
                      </article>
                      <article className="rounded-2xl border border-cyan-neon/20 bg-card p-5 flex items-center gap-4">
                        <div className="relative shrink-0">
                          <Ring value={MOCK.wearable.readiness} />
                          <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-3xl font-semibold">{MOCK.wearable.readiness}</span>
                            <span className="text-[10px] uppercase text-slate-400">score</span>
                          </div>
                        </div>
                        <div>
                          <p className="text-xs text-slate-400 uppercase">Daily readiness</p>
                          <p className="text-2xl font-semibold text-cyan-neon">{MOCK.wearable.readinessLabel}</p>
                          <p className="text-xs text-slate-500 mt-1">Body battery {MOCK.wearable.bodyBattery}</p>
                        </div>
                      </article>
                    </div>
                  </section>
                )}
                {show("training") && (
                  <section>
                    <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-violet-neon">Training log</p>
                    <h3 className="text-xl font-semibold mb-3">Cardio vs strength</h3>
                    <div className="grid gap-4 xl:grid-cols-2">
                      <article className="rounded-2xl border border-line bg-card overflow-hidden">
                        <div className="px-5 py-4 border-b border-line">
                          <h4 className="font-semibold">{MOCK.training.cardio.title}</h4>
                          <p className="text-[11px] text-slate-500">{MOCK.training.cardio.date}</p>
                        </div>
                        <div className="grid grid-cols-3 gap-px bg-line">
                          {[["Time", MOCK.training.cardio.duration], ["Incline", MOCK.training.cardio.incline], ["Calories", MOCK.training.cardio.calories + " kcal"], ["Distance", MOCK.training.cardio.distance], ["Avg HR", MOCK.training.cardio.avgHr + " bpm"], ["Pace", MOCK.training.cardio.pace]].map(([k, v]) => (
                            <div key={k} className="bg-card px-4 py-4">
                              <p className="text-[10px] uppercase text-slate-500">{k}</p>
                              <p className="mt-1 font-mono text-sm">{v}</p>
                            </div>
                          ))}
                        </div>
                      </article>
                      <article className="rounded-2xl border border-line bg-card overflow-hidden">
                        <div className="px-5 py-4 border-b border-line">
                          <h4 className="font-semibold">{MOCK.training.strength.title}</h4>
                          <p className="text-[11px] text-slate-500">{MOCK.training.strength.date} · {MOCK.training.strength.duration}</p>
                        </div>
                        {MOCK.training.strength.supersets.map((block) => (
                          <div key={block.name} className="px-5 py-3 border-t border-line">
                            <p className="mb-2 text-[11px] uppercase text-slate-500">{block.name}</p>
                            {block.pairs.map((ex) => (
                              <div key={ex.exercise} className="flex justify-between text-sm py-1">
                                <span>{ex.exercise}</span>
                                <span className="font-mono text-[11px] text-slate-400">{ex.sets} × {ex.reps} · {ex.load}</span>
                              </div>
                            ))}
                          </div>
                        ))}
                      </article>
                    </div>
                  </section>
                )}
                {show("nutrition") && (
                  <section>
                    <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-amber-300">Nutrition & supplements</p>
                    <h3 className="text-xl font-semibold mb-3">Low-carbohydrate day</h3>
                    <div className="grid gap-4 lg:grid-cols-5">
                      <article className="lg:col-span-3 rounded-2xl border border-line bg-card p-5 space-y-4">
                        <MacroBar label="Protein" {...MOCK.macros.protein} tone="protein" />
                        <MacroBar label="Fat" {...MOCK.macros.fat} tone="fat" />
                        <MacroBar label="Carbohydrates" {...MOCK.macros.carbs} tone="carbs" />
                        <MacroBar label="Energy" {...MOCK.macros.calories} tone="calories" />
                      </article>
                      <article className="lg:col-span-2 rounded-2xl border border-line bg-card p-5">
                        <div className="mb-4 flex justify-between text-sm">
                          <span>Daily checklist</span>
                          <span className="font-mono text-cyan-neon">{takenCount}/{supps.length}</span>
                        </div>
                        {supps.map((s) => (
                          <button key={s.id} onClick={() => setSupps((prev) => prev.map((x) => x.id === s.id ? { ...x, taken: !x.taken } : x))} className={`mb-3 w-full rounded-xl border px-3 py-3 text-left ${s.taken ? "border-cyan-neon/30 bg-cyan-neon/5" : "border-line bg-void"}`}>
                            <span className="block text-sm font-medium">{s.taken ? "✓ " : ""}{s.name}</span>
                            <span className="block text-[11px] text-slate-500">{s.dose} · {s.timing}</span>
                          </button>
                        ))}
                      </article>
                    </div>
                  </section>
                )}
              </main>
            </div>
          </div>
        );
      }

      function App() {
        const [signedIn, setSignedIn] = useState(false);
        if (!signedIn) return <LoginScreen onSignIn={() => setSignedIn(true)} />;
        return <Dashboard onSignOut={() => setSignedIn(false)} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
